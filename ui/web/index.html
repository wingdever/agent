<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- shell: 整体界面外壳（三栏并排） -->
<div class="shell" data-name="shell">

  <!-- thread-sidebar: 左侧会话栏 -->
  <aside class="thread-sidebar" id="sidebar" data-name="thread-sidebar">
    <div class="sidebar-header" data-name="sidebar-header">
      <span class="agent-badge" data-name="agent-badge">Agent</span>
    </div>
    <button class="new-session-button" data-name="new-session-button">+ 新建会话</button>
    <div class="workspace-bar" data-name="workspace-bar">
      <button class="search-btn" data-name="search-btn" title="搜索会话">搜索</button>
      <button class="view-options-btn" data-name="view-options-btn" title="视图选项">视图</button>
      <button class="add-workspace-btn" data-name="add-workspace-btn">+ 工作区</button>
      <button class="trash-btn" data-name="trash-btn" title="回收站">🗑</button>
      <input class="search-input" data-name="search-input" type="text" placeholder="过滤会话名…" hidden />
    </div>
    <div class="workspace-session-tree-list" data-name="workspace-session-tree-list">
      <!-- 空：暂无会话 -->
    </div>
    <div class="deleted-sessions-list" data-name="deleted-sessions-list" hidden>
      <!-- 回收站：已软删的会话 -->
    </div>
    <button class="models-btn" id="modelsBtn" data-name="models-btn">🧩 模型</button>
    <button class="permissions-btn" id="permissionsBtn" data-name="permissions-btn">🔐 权限</button>
    <button class="settings-btn" id="settingsBtn" data-name="settings-btn">⚙ 设置</button>
  </aside>

  <!-- chat-viewport: 中间聊天主视口 -->
  <main class="chat-viewport" id="viewport" data-name="chat-viewport">
    <div class="chat-header" data-name="chat-header">
      <button class="left-collapse-button" id="leftCollapse" data-name="left-collapse-button" title="折叠">«</button>
      <span class="session-name" data-name="session-name"></span>
      <button class="activity-indicator" id="activityIndicator" data-name="activity-indicator" title="当前活动（点击切换）">活动: bare-chat</button>
      <button class="presence-switch" id="presenceSwitch" data-name="presence-mode-switch" title="在场状态（in/out，自动推断，可手动切换）">在场: in</button>
      <button class="autonomy-switch" id="autonomySwitch" data-name="autonomy-mode-switch" title="自主度（supervised/autonomous，可手动提权/降权）">自主: supervised</button>
      <div class="tab-icons" data-name="tab-icons">
        <button class="chat-tab-icon active" data-target="chat-tab" data-name="chat-tab-icon">聊天</button>
        <button class="trajectory-icon" data-target="trajectory-tab" data-name="trajectory-icon">轨迹</button>
      </div>
      <button class="right-collapse-button" id="rightCollapse" data-name="right-collapse-button" title="折叠右栏">»</button>
    </div>

    <div class="tab-body" data-name="tab-body">
      <!-- chat-tab: 聊天标签页（层级：turn* > step* > (agent-request? + model-response(thought?/answer?/tool-call-card*))） -->
      <div class="chat-tab" id="chatTab" data-name="chat-tab">
        <div class="empty-hint">还没有对话，发送消息开始吧</div>
      </div>

      <!-- trajectory-tab: 轨迹标签页（空状态，默认隐藏） -->
      <div class="trajectory-tab" id="trajectoryTab" data-name="trajectory-tab" hidden>
        <div class="empty-hint">暂无轨迹</div>
      </div>
    </div>

    <!-- composer: 输入区 -->
    <div class="composer" data-name="composer">
      <div class="model-http-status" data-name="model-http-status">
        <span class="state on-wait">wait</span>
        <span class="state on-post" hidden>post</span>
        <span class="state on-get" hidden>get</span>
      </div>
      <div class="ref-chips" data-name="ref-chips" hidden></div>
      <textarea class="input-textarea" data-name="input-textarea" placeholder="输入消息，Enter 发送（Shift+Enter 换行）；输入 @ 或点 @ 按钮引用文件/会话；/compact 压缩上下文"></textarea>
      <div class="composer-footer" data-name="composer-footer">
        <button class="think-switch" id="thinkSwitch" data-name="think-switch" title="思考模式">思考</button>
        <button class="search-switch" id="searchSwitch" data-name="search-switch" title="联网搜索">搜索</button>
        <select class="permission-selector" id="permissionSelector" data-name="permission-selector" title="权限预设">
          <option value="read-only">只读模式</option>
          <option value="workspace-write">写工作区</option>
          <option value="full-access">完全访问</option>
          <option value="fine-grained">精细配置</option>
        </select>
        <div class="model-effort-selector" data-name="model-effort-selector">
          <select class="model-selector" id="modelSelector" data-name="model-selector" title="模型"></select>
          <select class="effort-selector" id="effortSelector" data-name="effort-selector" title="推理等级">
            <option value="low">low</option>
            <option value="medium" selected>medium</option>
            <option value="high">high</option>
          </select>
        </div>
        <button class="ref-btn" id="refBtn" data-name="ref-btn" title="引用文件或会话（@）">@</button>
        <button class="send-or-stop-btn" data-name="send-or-stop-btn">发送</button>
      </div>
    </div>

    <!-- chat-footer: 聊天底部状态区（DSH 风格：turns/steps/tok-s · token 用量/缓存 · 上下文占用） -->
    <div class="chat-footer" data-name="chat-footer">
      <span class="session-statistics" data-name="session-statistics"></span>
      <span class="token-usage" data-name="token-usage"></span>
      <span class="context-used" data-name="context-used"></span>
    </div>
  </main>

  <!-- context-panel: 右侧上下文面板（默认隐藏） -->
  <aside class="context-panel" id="contextPanel" data-name="context-panel" hidden>
    <div class="context-default">点击左侧任意 <b>tool-call</b> 卡片查看其参数与结果摘要。文件写类工具可点卡片上的「预览」查看产物。</div>
    <div class="artifact-preview" id="artifactPreview" data-name="artifact-preview" hidden>
      <div class="artifact-preview-head">
        <span class="artifact-preview-title" id="artifactPreviewTitle"></span>
        <button class="artifact-preview-open" id="artifactPreviewOpen" data-name="artifact-preview-open" hidden>在编辑器打开</button>
      </div>
      <div class="artifact-preview-body" id="artifactPreviewBody"></div>
    </div>
    <div class="context-detail" id="contextDetail" hidden>
      <div class="ctx-title" id="ctxTitle"></div>
      <div class="ctx-section"><h4>参数</h4><pre id="ctxArgs"></pre></div>
      <div class="ctx-section"><h4>结果</h4><pre id="ctxResult"></pre></div>
      <div class="ctx-section"><h4>引用来源</h4><div id="ctxRefs">—</div></div>
    </div>
  </aside>

</div>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="markdown.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script src="models.js"></script>
<script src="settings.js"></script>
<script src="permissions.js"></script>
</body>
</html>
